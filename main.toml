[[action]]
name = "Backup-Maintenance"
description = "Runs backup-manager.sh maintenance commands. Pass ARGS.command = 'maintenance' (weekly retention + prune + check) or 'sync-offsite' (copy new snapshots to the offsite repo). Optional ARGS.server (default: Local)."
[action.config]
file_contents = """
const command: string = ARGS.command ?? 'maintenance';
const serverName: string = ARGS.server ?? 'Local';

const allowed = ['maintenance', 'sync-offsite'];
if (!allowed.includes(command)) {
    throw new Error(`Unsupported command: '${command}'. Allowed: ${allowed.join(', ')}`);
}

const scriptPath = '/etc/komodo/repos/homelabbing/scripts/backup-manager.sh';

const servers = await komodo.read('ListServers', {});
const server = servers.find((s: any) => s.name === serverName);
if (!server) {
    throw new Error(`Server not found: '${serverName}'`);
}

const terminalName = `backup-${command}-${Date.now()}`;
await komodo.write('CreateTerminal', {
    name: terminalName,
    server: serverName,
    command: "bash"
});

// Same two timeout layers as Backup-Service, with a larger budget since
// prune can take longer than a backup.
let timer;
const timedOut = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(`'${command}' exceeded 3 hours, aborting`)), 185 * 60 * 1000);
});

try {
    const cmd = `nsenter -t 1 -m -n -- timeout -k 60 10800 bash ${scriptPath} ${command}`;

    console.log(`Running: ${scriptPath} ${command} on ${serverName}`);
    let exitCode = null;
    await Promise.race([
        komodo.execute_terminal({
            command: cmd,
            server: server.id,
            terminal: terminalName
        }, {
            onLine: (line) => console.log(line),
            onFinish: (code) => { console.log("Finished:", code); exitCode = code; },
        }),
        timedOut,
    ]);
    if (String(exitCode) !== '0') {
        throw new Error(`'${command}' exited with code ${exitCode}`);
    }
    console.log(`✓ ${command} completed`);
} finally {
    clearTimeout(timer);
    await komodo.write('DeleteTerminal', { terminal: terminalName, server: server.id });
}
"""

##

[[action]]
name = "Backup-Service"
description = "Backs up a single service by routing to the correct server via Komodo Periphery. Pass ARGS.service = <service name from backup-config.yml>."
[action.config]
file_contents = """
const service: string = ARGS.service;
if (!service) throw new Error('ARGS.service is required');

const scriptPath = '/etc/komodo/repos/homelabbing/scripts/backup-manager.sh';

// Find the Komodo stack matching this service name
const stacks = await komodo.read('ListStacks', {});
const stack = stacks.find((s: any) => s.name === service);

if (!stack) {
    throw new Error(`No Komodo stack found matching service name: '${service}'. Ensure the stack name matches the backup-config.yml service name, or add a 'komodo_stack' override in backup-config.yml.`);
}

const serverId: string = stack.info.server_id;

// Resolve server ID to server name (required for CreateTerminal)
const servers = await komodo.read('ListServers', {});
const server = servers.find((s: any) => s.id === serverId);

if (!server) {
    throw new Error(`Could not resolve server for id: '${serverId}'`);
}

const serverName: string = server.name;
console.log(`Service '${service}' found on server: '${serverName}' (id: ${serverId})`);

const terminalName = `backup-${service}-${Date.now()}`;
// Create an ephemeral terminal on the target server
const terminal = await komodo.write('CreateTerminal', {
    name: terminalName,
    server: serverName,
    command: "bash"
});


// Two timeout layers so a hung backup can never wedge the procedure again
// (like the run stuck from Mar 13): 'timeout' kills the script on the host
// after 60 min, and the Promise.race aborts the action even if the terminal
// stream itself dies and execute_terminal never resolves.
let timer;
const timedOut = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(`Backup for '${service}' exceeded 65 minutes, aborting`)), 65 * 60 * 1000);
});

try {
    const cmd = `nsenter -t 1 -m -n -- timeout -k 60 3600 bash ${scriptPath} backup ${service}`;

    console.log(`Running: ${scriptPath} backup ${service}`);
    let exitCode = null;
    const result = await Promise.race([
        komodo.execute_terminal({
            command: cmd,
            server: serverId,
            terminal: terminalName
        }, {
            onLine: (line) => console.log(line),
            onFinish: (code) => { console.log("Finished:", code); exitCode = code; },
        }),
        timedOut,
    ]);
    console.log('Result:', JSON.stringify(result, null, 2));
    // Propagate script failure so the procedure shows red instead of silently succeeding
    if (String(exitCode) !== '0') {
        throw new Error(`Backup for '${service}' exited with code ${exitCode}`);
    }
    console.log(`✓ Backup completed for: ${service}`);
} finally {
    clearTimeout(timer);
    // Always clean up the terminal even if backup fails
    await komodo.write('DeleteTerminal', { terminal: terminalName, server: serverId });
}
"""

