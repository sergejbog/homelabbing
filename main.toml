[[server]]
name = "pi"
description = "Raspberry Pi 5 at home. Tailnet only; Periphery connects out to Core."
[server.config]
enabled = true

##

[[stack]]
name = "bookorbit"
description = "BookOrbit library at https://bookorbit.pi.sniperoo.app. Data and books in /srv/bookorbit. Secrets from Infisical /bookorbit."
[stack.config]
server = "pi"
links = ["https://bookorbit.pi.sniperoo.app"]
repo = "sergejbog/homelabbing"
webhook_enabled = false
run_directory = "services/bookorbit"
file_paths = ["docker-compose.yaml"]
pre_deploy.path = "../../scripts"
pre_deploy.command = "bash ./fetch-secrets-pre-deploy.sh bookorbit"
post_deploy.path = "../../scripts"
post_deploy.command = "bash ./cleanup-secrets-post-deploy.sh bookorbit"

##

[[stack]]
name = "glance"
description = "Glance dashboard at https://glance.pi.sniperoo.app. Secrets from Infisical /glance."
[stack.config]
server = "pi"
links = ["https://glance.pi.sniperoo.app"]
repo = "sergejbog/homelabbing"
webhook_enabled = false
run_directory = "services/glance"
file_paths = ["docker-compose.yml"]
pre_deploy.path = "../../scripts"
pre_deploy.command = "bash ./fetch-secrets-pre-deploy.sh glance"
post_deploy.path = "../../scripts"
post_deploy.command = "bash ./cleanup-secrets-post-deploy.sh glance"

##

[[stack]]
name = "infisical"
description = "Infisical at https://secrets.pi.sniperoo.app. The stopped archive of the old instance is run by hand, not by Komodo."
[stack.config]
server = "pi"
links = [
  "https://secrets.pi.sniperoo.app"
]
repo = "sergejbog/homelabbing"
webhook_enabled = false
run_directory = "services/infisical"
file_paths = ["docker-compose.yml"]

##

[[stack]]
name = "traefik"
description = "Reverse proxy for *.pi.sniperoo.app on the tailnet IP. Wildcard certificate via deSEC. Route files: services/traefik/dynamic."
[stack.config]
server = "pi"
repo = "sergejbog/homelabbing"
webhook_enabled = false
run_directory = "services/traefik"
file_paths = ["docker-compose.yaml"]

##

[[stack]]
name = "vaultwarden"
description = "Vaultwarden at https://vw.pi.sniperoo.app."
[stack.config]
server = "pi"
links = ["https://vw.pi.sniperoo.app"]
repo = "sergejbog/homelabbing"
webhook_enabled = false
run_directory = "services/vaultwarden"
file_paths = ["docker-compose.yaml"]

##

[[stack]]
name = "backup-pi"
description = "Backup jobs for the Pi (services/backup). Never deployed: the backup-pi procedures run its services. Pinned to a commit; change it with a PR that bumps the sha."
[stack.config]
server = "pi"
repo = "sergejbog/homelabbing"
commit = "99fc57dc2c12cffc9654cff37bc5c631c0b92e75"
webhook_enabled = false
run_directory = "services/backup"
file_paths = ["docker-compose.yaml", "pi.yaml"]
environment = """
SERVER=pi
"""

##

[[procedure]]
name = "backup-pi-dumps"
description = "Nightly: consistent database dumps for backup-pi at 04:00. One stack job per stage: Komodo refuses a second run on a busy stack."
[procedure.config]
schedule_format = "Cron"
schedule = "0 30 3 * * *"
schedule_timezone = "Europe/Skopje"
schedule_alert = false
failure_alert = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Vaultwarden and Komodo"
enabled = true
executions = [
  { execution.type = "RunStackService", execution.params = { stack = "backup-pi", service = "dump-vaultwarden", no_tty = true }, enabled = true },
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

[[procedure.config.stage]]
name = "Infisical"
enabled = true
executions = [
  { execution.type = "RunStackService", execution.params = { stack = "backup-pi", service = "dump-infisical", no_tty = true }, enabled = true }
]

[[procedure.config.stage]]
name = "BookOrbit"
enabled = true
executions = [
  { execution.type = "RunStackService", execution.params = { stack = "backup-pi", service = "dump-bookorbit", no_tty = true }, enabled = true }
]

##

[[procedure]]
name = "backup-pi"
description = "Nightly: restic of /srv to B2, with the dumps from backup-pi-dumps (03:30). Separate, so a failed dump doesn't stop the upload."
[procedure.config]
schedule_format = "Cron"
schedule = "0 0 4 * * *"
schedule_timezone = "Europe/Skopje"
schedule_alert = false
failure_alert = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Upload to B2"
enabled = true
executions = [
  { execution.type = "RunStackService", execution.params = { stack = "backup-pi", service = "restic-backup", no_tty = true }, enabled = true }
]

##

[[procedure]]
name = "backup-pi-check"
description = "Weekly: restic check, reading back 10% of the data."
[procedure.config]
schedule_format = "Cron"
schedule = "0 0 5 * * SUN"
schedule_timezone = "Europe/Skopje"
schedule_alert = false
failure_alert = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Check"
enabled = true
executions = [
  { execution.type = "RunStackService", execution.params = { stack = "backup-pi", service = "restic-check", no_tty = true }, enabled = true }
]

##

[[repo]]
name = "homelabbing"
[repo.config]
server = "pi"
git_account = "sergejbog"
repo = "sergejbog/homelabbing"

##

[[resource_sync]]
name = "pi"
description = "Syncs this file. Review pending changes before Execute."
[resource_sync.config]
linked_repo = "homelabbing"
resource_path = ["main.toml"]
managed = true