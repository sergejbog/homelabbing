# Glance dashboard for glance.pi.sniperoo.app on the Pi, tailnet only.
# Komodo stack "glance" (main.toml) deploys this folder from its own clone of
# the repo. config/ and assets/ come from git; the secrets stay on the Pi in
# /srv/glance/secrets (root 0700), never in git.
#
# - Glance reads each secret itself with ${secret:<name>} from /run/secrets,
#   so nothing secret is in the container env, `docker inspect` or Komodo.
# - Glance substitutes ${...} even inside commented-out YAML lines: an unset
#   variable or a missing secret file anywhere in an included file stops it
#   from starting. Comment out the `$include:` line of a widget instead.
# - Egress is needed: weather, markets, cinema and word-of-the-day widgets
#   fetch from the internet on the server side.
name: glance

services:
  glance:
    image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    container_name: glance
    restart: unless-stopped
    user: "65530:65530"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    environment:
      # Used by links and monitor checks in config/ (not a secret).
      DOMAIN_NAME: pi.sniperoo.app
    secrets:
      - secret_key
      - admin_password_hash
      - email_second
      - email_third
      - email_fourth
    volumes:
      - ./config:/app/config:ro
      - ./assets:/app/assets:ro
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp
    networks:
      - egress
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  # All root:65530 0640, written by pi-glance.sh secrets. Compose in Komodo
  # Periphery warns that the files "do not exist": Periphery can't see /srv,
  # but the Docker daemon mounts them from the host.
  secret_key:
    # 64 random bytes, base64 (Glance's session signing key).
    file: /srv/glance/secrets/secret_key
  admin_password_hash:
    # bcrypt hash of the dashboard password for user "admin".
    file: /srv/glance/secrets/admin_password_hash
  # Titles of the Gmail bookmarks (mail-bookmarks.yml), kept out of the
  # public repo.
  email_second:
    file: /srv/glance/secrets/email_second
  email_third:
    file: /srv/glance/secrets/email_third
  email_fourth:
    file: /srv/glance/secrets/email_fourth

networks:
  # Outbound for the widgets that fetch from the internet.
  egress: {}
  # Shared with Traefik and the other backends (monitor checks go straight
  # to the containers). internal: no internet through it.
  proxy:
    name: proxy
    external: true
