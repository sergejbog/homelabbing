# Services that run on the Pi. Glance checks each one straight over the
# proxy network (check-url); the url is the link you click.
# Traefik itself isn't listed: if it is down, this page is unreachable.
# Add a service here when it is ported to the Pi.
- type: monitor
  cache: 1m
  title: Self Hosted Services
  sites:
    - title: Vaultwarden
      url: https://vw.${DOMAIN_NAME}
      check-url: http://vaultwarden:8080/alive
      icon: sh:vaultwarden-light
    - title: Infisical
      url: https://secrets.${DOMAIN_NAME}
      check-url: http://infisical-backend:8080/api/status
      icon: di:infisical
    - title: Komodo
      url: https://komodo.${DOMAIN_NAME}
      check-url: http://komodo-core:9120/
      icon: sh:komodo
