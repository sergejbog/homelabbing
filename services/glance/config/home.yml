- name: Home
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true
  # head-widgets:

  # Commented out until they exist on the Pi: Uptime Kuma, the Grafana
  # dashboard and the Komodo stacks. Comment out whole `$include:` lines only:
  # Glance fills in variables even on commented-out lines, so a widget with an
  # unset variable must live in its own file.
  columns:
    - size: small
      widgets:
        # - $include: ./widgets/uptime-kuma.yml
        - type: server-stats
          servers:
            - type: local
              name: Raspberry Pi
              # Inside the container most mountpoints are bind mounts; "/" is
              # the overlay on the SD card.
              hide-mountpoints-by-default: true
              mountpoints:
                "/":
                  name: SD card
                  hide: false
        - $include: ./widgets/mail-bookmarks.yml

    - size: full
      widgets:
        # - $include: ./widgets/grafana.yml
        - type: group
          widgets:
            - $include: ./widgets/monitor.yml

            # - $include: ./widgets/komodo.yml
        - $include: ./widgets/cineplexx.yml

    - size: small
      widgets:
        - type: clock
          hour-format: 24h
        - $include: ./widgets/weather.yml
        - type: markets
          hide-header: true
          markets:
            - symbol: SPY
              name: S&P 500
            - symbol: BTC-USD
              name: Bitcoin
              chart-link: https://www.tradingview.com/chart/?symbol=INDEX:BTCUSD
            - symbol: SOL-USD
              name: Solana
              chart-link: https://www.tradingview.com/chart/?symbol=COINBASE:SOLUSD
            - symbol: JUP29210-USD
              name: Jupiter
              chart-link: https://www.tradingview.com/chart/?symbol=BINANCE:JUPUSDT
        - $include: ./widgets/word-of-the-day.yml
