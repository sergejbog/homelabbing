- name: Home
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true
  # head-widgets:

  columns:
    - size: small
      widgets:
        - $include: ./widgets/uptime-kuma.yml
        - type: server-stats
          servers:
            - type: local
              name: Hetzner Server
            - type: remote
              name: Ex44 Server
              url: http://${SECONDARY_SERVER_IP}:${GLANCE_REMOTE_PORT}
              token: ${GLANCE_REMOTE_TOKEN}
            - type: remote
              name: Raspberry Pi
              url: https://glance-agent.pi.${DOMAIN_NAME}
              token: ${GLANCE_REMOTE_TOKEN}
        - $include: ./widgets/mail-bookmarks.yml

    - size: full
      widgets:
        # Collapsed by default — <details> keeps it a pure-CSS toggle (styles in assets/user.css).
        - type: html
          source: |
            <details class="grafana-panel">
              <summary>Grafana Dashboard</summary>
              <iframe src="https://grafana.${DOMAIN_NAME}/public-dashboards/${GRAFANA_PUBLIC_DASHBOARD_ID}" frameborder="0" loading="lazy"></iframe>
            </details>
        - type: group
          widgets:
            - $include: ./widgets/monitor.yml

            - $include: ./widgets/komodo.yml
        - $include: ./widgets/cineplexx.yml
        - $include: ./widgets/word-of-the-day.yml

    - size: small
      widgets:
        - type: clock
          hour-format: 24h
        - $include: ./widgets/weather.yml
        - type: markets
          hide-header: true
          markets:
            - symbol: SPY
              name: S&P 500
            - symbol: BTC-USD
              name: Bitcoin
              chart-link: https://www.tradingview.com/chart/?symbol=INDEX:BTCUSD
            - symbol: SOL-USD
              name: Solana
              chart-link: https://www.tradingview.com/chart/?symbol=COINBASE:SOLUSD
            - symbol: JUP29210-USD
              name: Jupiter
              chart-link: https://www.tradingview.com/chart/?symbol=BINANCE:JUPUSDT
        - $include: ./widgets/external-bookmarks.yml
