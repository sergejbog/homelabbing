server:
  assets-path: /app/assets
  # Behind Traefik: use the rightmost X-Forwarded-For (set by Traefik) as the
  # client address for the login rate limit.
  proxied: true

theme:
  background-color: 225 14 15
  primary-color: 157 47 65
  contrast-multiplier: 1.1
  custom-css-file: /assets/user.css

pages:
  # It's not necessary to create a new file for each page and include it, you can simply
  # put its contents here, though multiple pages are easier to manage when separated
  - $include: home.yml
  # - $include: finance.yml

auth:
  # Both files are in /srv/glance/secrets on the Pi (pi-glance.sh secrets).
  secret-key: ${secret:secret_key}
  users:
    admin:
      password-hash: ${secret:admin_password_hash}
