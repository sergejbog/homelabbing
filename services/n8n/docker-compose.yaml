volumes:
  pg_data:
  root-folder:
  redis_data:


services:
  redis:
    image: redis:latest
    container_name: redis-for-n8n
    restart: always
    env_file: .env
    command: redis-server --requirepass $REDIS_PASSWORD
    volumes:
      - redis_data:/data
    networks:
      proxy:


  postgres:
    image: postgres:17
    container_name: n8n-postgres
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      proxy:


  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    ports:
      - "5678:5678"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.entrypoints=https"
      - "traefik.http.routers.n8n.rule=Host(`automation.${DOMAIN_NAME}`)"
      - "traefik.http.routers.n8n.middlewares=AddForwardedHeader@file"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
      - "traefik.http.routers.n8n.service=n8n"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"
    volumes:
      - root-folder:/root/.n8n
    networks:
      proxy:


networks:
  proxy:
    external: true
