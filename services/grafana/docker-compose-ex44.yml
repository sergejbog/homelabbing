name: grafana-stack
volumes:
  tempo-data: {}
  cache: {}
  loki: {}
  mimir: {}
  main-data: {}

services:
  opentelemetry-collector:
    networks:
      - proxy
    env_file: .env
    image: otel/opentelemetry-collector-contrib:latest
    environment:
      # Loki runs on this host (stack loki) and only publishes on 127.0.0.1; reach it on the proxy network.
      - LOKI_HOST=loki
    # OTLP (4317/4318) stays public: the ECS services send to it, with basic auth. The rest is local only.
    ports:
      - "127.0.0.1:12347:12345"
      - "127.0.0.1:12348:12348"
      - "127.0.0.1:6832:6832"
      - "127.0.0.1:55679:55679"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yml
    command: [ "--config=/etc/otel-collector-config.yml" ]
  grafana:
    user: "0"
    networks:
      - proxy
    image: grafana/grafana:latest
    container_name: grafana
    env_file: .env
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning"
      - 'main-data:/var/lib/grafana'
    environment:
      - LOKI_HOST=loki
      - GF_FEATURE_TOGGLES_ENABLE=flameGraph traceqlSearch traceQLStreaming correlations metricsSummary traceqlEditor traceToMetrics traceToProfiles datatrails logsContextDatasourceUi
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app,grafana-exploretraces-app,grafana-pyroscope-app
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_DOMAIN=grafana-ex44.${DOMAIN_NAME}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=https://grafana-ex44.${DOMAIN_NAME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.rule=Host(`grafana-ex44.${DOMAIN_NAME}`)"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=AddForwardedHeader@file"
      - "traefik.http.routers.grafana.tls=true"
  tempo:
    image: grafana/tempo:main-8b5ef72
    container_name: tempo
    user: "0:0"
    env_file: .env
    networks:
      - proxy
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:9411:9411"
      - "127.0.0.1:55680:55680"
      - "127.0.0.1:55681:55681"
      - "127.0.0.1:14250:14250"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - "./tempo/tempo.yaml:/etc/tempo.yaml"
      - tempo-data:/data/tempo

  mimir:
    container_name: mimir
    image: grafana/mimir:latest
    command: [ "-ingester.native-histograms-ingestion-enabled=true", "-config.file=/etc/mimir.yaml" ]
    networks:
      - proxy
    ports:
      - "127.0.0.1:9009:9009"
    volumes:
      - "./mimir/mimir.yaml:/etc/mimir.yaml"
      - mimir:/mimir

networks:
  proxy:
    external: true
