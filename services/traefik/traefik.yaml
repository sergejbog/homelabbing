log:
  level: "DEBUG"

api:
  dashboard: true
  debug: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
  postgres:
    address: ":5432"
  mariadb:
    address: ":3306"

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

  file:
    directory: /dynamic
    watch: true

certificatesResolvers:
  myresolver:
    acme:
      # DNS-01 via Route53: needed for the *.{DOMAIN_NAME} wildcard cert on the
      # catch-all router, and keeps working for any hostname now that the
      # wildcard DNS record points everything at this server. Credentials come
      # from .env (Infisical /traefik): AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_HOSTED_ZONE_ID.
      dnsChallenge:
        provider: route53
      email: '{{ env "LETSENCRYPT_EMAIL" }}'
      storage: "/letsencrypt/acme.json"
      # caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"

experimental:
  plugins:
    AddForwardedHeader:
      moduleName: "github.com/jerrywoo96/AddForwardedHeader"
      version: "v1.0.1"
