# Static config for the Pi's Traefik.
#
# - Tailnet only: compose publishes 100.65.226.80:443 -> 8443, nothing else.
# - File provider only. Traefik has NO Docker socket (the incident started from
#   containers holding docker.sock). Add a service by dropping a route file
#   into dynamic/ (see dynamic/vaultwarden.yaml for the shape).
# - One wildcard certificate, *.pi.sniperoo.app, via DNS-01 at deSEC. Route
#   files must NOT set their own `tls:` section: a router-level tls section
#   replaces the entrypoint's, and a per-host request would put service names
#   into certificate transparency logs.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

entryPoints:
  https:
    address: ":8443"
    http:
      tls:
        certResolver: desec
        domains:
          - main: "*.pi.sniperoo.app"
  ping:
    # Container-internal, used by the healthcheck. Not published.
    address: ":8082"

ping:
  entryPoint: ping

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  desec:
    acme:
      storage: /data/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      keyType: EC256
      dnsChallenge:
        provider: desec
        # Public resolvers: lego follows the CNAME _acme-challenge.pi ->
        # _acme-challenge.acme.sniperoo.app (deSEC) with these. Never point
        # them at the home router.
        resolvers:
          - "1.1.1.1:53"
          - "9.9.9.9:53"
