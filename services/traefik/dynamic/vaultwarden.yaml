# Vaultwarden at https://vw.pi.sniperoo.app.
# Deployed with the traefik stack. No tls section: the
# https entrypoint's wildcard applies (see traefik.yaml).
#
# /admin is limited to the owner's own devices by tailnet IP, so it stays
# closed if Vaultwarden users or shared nodes are added to the tailnet later.
# If a device's tailnet IP changes, update the list (`tailscale status`).
http:
  routers:
    vaultwarden:
      rule: Host(`vw.pi.sniperoo.app`)
      entryPoints:
        - https
      service: vaultwarden
    vaultwarden-admin:
      # Longer rule, so it has the higher default priority.
      rule: Host(`vw.pi.sniperoo.app`) && PathPrefix(`/admin`)
      entryPoints:
        - https
      middlewares:
        - vaultwarden-admin-owner
      service: vaultwarden
  middlewares:
    vaultwarden-admin-owner:
      ipAllowList:
        sourceRange:
          - 100.125.193.68/32   # desktop-mmn885k (PC)
          - 100.110.101.104/32  # mimence
          - 100.77.213.42/32    # nothing-phone-3a
  services:
    vaultwarden:
      loadBalancer:
        servers:
          - url: http://vaultwarden:8080
