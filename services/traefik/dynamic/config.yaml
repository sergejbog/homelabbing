http:
  middlewares:
    admin-auth:
      basicAuth:
        users:
          - '{{ env "BASIC_AUTH" }}'
    AddForwardedHeader:
      plugin:
        AddForwardedHeader:
          by: Traefik # The IP that traefik uses to communicate with the destination server.
          forHeader: X-Real-Ip # Get the Client IP from this header.

  routers:
    pihole:
      rule: Host(`pihole.{{ env "DOMAIN_NAME" }}`)
      service: pihole
      entryPoints:
        - https
      tls:
        certResolver: myresolver
    firefly:
      rule: Host(`finance.{{ env "DOMAIN_NAME" }}`)
      service: firefly
      entryPoints:
        - https
      tls:
        certResolver: myresolver
    fireflyimporter:
      rule: Host(`finance-importer.{{ env "DOMAIN_NAME" }}`)
      service: fireflyimporter
      entryPoints:
        - https
      tls:
        certResolver: myresolver
    ex44-periphery:
      rule: Host(`ex44.periphery.{{ env "DOMAIN_NAME" }}`)
      service: ex44-periphery
      entryPoints:
        - https
      tls:
        certResolver: myresolver
    # Lowest-priority fallback: anything no other router claims (mainly
    # Coolify-deployed apps on ex44, which are invisible to main.toml) is
    # forwarded to ex44's Coolify Traefik. tls.domains drives the wildcard
    # cert order (DNS-01), so unknown hostnames still get valid TLS here.
    catch-all:
      rule: HostRegexp(`^.+$`)
      priority: 1
      entryPoints:
        - https
      service: edge-ex44-catchall
      tls:
        certResolver: myresolver
        domains:
          - main: '{{ env "DOMAIN_NAME" }}'
            sans:
              - '*.{{ env "DOMAIN_NAME" }}'

  services:
    pihole:
      loadBalancer:
        servers:
          - url: http://{{ env "WIREGUARD_PEER_IP" }}:80
    firefly:
      loadBalancer:
        servers:
          - url: http://{{ env "WIREGUARD_PEER_IP" }}:8080 # Peer's WireGuard IP + container port
    fireflyimporter:
      loadBalancer:
        servers:
          - url: http://{{ env "WIREGUARD_PEER_IP" }}:8081 # Peer's WireGuard IP + container port
    ex44-periphery:
      loadBalancer:
        servers:
          - url: https://{{ env "EX44_IP" }}:8120
    edge-ex44-catchall:
      loadBalancer:
        servers:
          - url: https://{{ env "EX44_IP" }}:443
